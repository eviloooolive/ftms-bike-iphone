name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: xcodebuild -version

      - name: Confirm scheme exists
        run: xcodebuild -project FTMSBike.xcodeproj -list

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild archive \
            -project FTMSBike.xcodeproj \
            -scheme FTMSBike \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FTMSBike.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO

      - name: List archive products (debug)
        run: ls -la build/FTMSBike.xcarchive/Products/Applications/

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf Payload FTMSBike.ipa
          mkdir -p Payload
          cp -r build/FTMSBike.xcarchive/Products/Applications/FTMSBike.app Payload/
          zip -r FTMSBike.ipa Payload
          ls -la FTMSBike.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FTMSBike-unsigned-ipa
          path: FTMSBike.ipa
          if-no-files-found: error
